{{- if .Values.serviceAccount.create }}
# No IRSA annotation here, deliberately: nginx just serves static files -
# it never calls an AWS API. The API URL the browser calls directly is
# baked in as a plain env var, not fetched at runtime. A plain
# ServiceAccount is here only so the pod doesn't run as `default` -
# identity hygiene, not AWS access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conduit-frontend.serviceAccountName" . }}
  labels:
    {{- include "conduit-frontend.labels" . | nindent 4 }}
{{- end }}
