{{- if .Values.ingress.enabled }}
# No custom domain/ACM cert wired up for this project (see
# docs/design-decisions.md) - this provisions a plain internet-facing ALB
# on its default *.elb.amazonaws.com hostname over HTTP. A real deployment
# would add a Route53 record + ACM cert here and switch to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conduit-backend.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/ping/
    {{- if .Values.ingress.accessLogsBucket }}
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket={{ .Values.ingress.accessLogsBucket }},access_logs.s3.prefix=backend
    {{- end }}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "conduit-backend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
