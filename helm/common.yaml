# Values shared by every environment. Kept deliberately small - most
# real config here is either static-and-per-environment (<env>.yaml) or
# apply-time-and-per-environment (<env>.generated.yaml from Terraform).
project: conduit

# No imageTag here (there used to be one, meant to be overridden via
# `helmfile --state-values-set imageTag=<git-sha>`): state values render
# before CLI overrides merge, so that flag never actually reached
# values.yaml.gotmpl's template. deploy-backend.yml now passes the tag
# via `helmfile apply --set image.tag=<git-sha>` instead, applied
# directly to the chart's own values - see docs/design-decisions.md.
