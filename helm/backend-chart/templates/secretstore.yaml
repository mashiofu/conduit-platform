{{/*
Two ClusterSecretStores, not one: External Secrets Operator's AWS
provider is single-service per store (SecretsManager XOR ParameterStore),
so the RDS-managed credential (Secrets Manager) and JWT_SECRET (SSM
Parameter Store) each need their own. Both authenticate as the ESO
controller's own ServiceAccount/IRSA role from terraform/modules/eks -
cluster-scoped (not namespaced to this app) because if a second app ever
needs secrets, these are reusable as-is. Revisit if that becomes an
actual isolation concern.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameterstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
