{{- if .Values.serviceAccount.create }}
# No IRSA annotation here, deliberately: the backend never calls an AWS
# API directly - Postgres/Redis creds and JWT_SECRET arrive pre-synced
# into a Kubernetes Secret by External Secrets Operator (which has its
# own, separately-scoped IRSA role). A plain ServiceAccount is here only
# so the pod doesn't run as `default` - identity hygiene, not AWS access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conduit-backend.serviceAccountName" . }}
  labels:
    {{- include "conduit-backend.labels" . | nindent 4 }}
{{- end }}
