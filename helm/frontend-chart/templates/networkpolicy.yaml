{{- if .Values.networkPolicy.enabled }}
# Enforcement requires the VPC CNI's network policy feature enabled on
# the vpc-cni EKS addon (see terraform/modules/eks) - without that, this
# manifest applies cleanly but doesn't actually restrict anything.
#
# Egress is far narrower than the backend's own NetworkPolicy: nginx
# only serves static files it already has locally - it never makes an
# outbound call to Postgres, Redis, or even the backend itself (the
# browser calls the backend API directly, bypassing this pod entirely).
# DNS is the only egress this pod genuinely needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "conduit-frontend.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "conduit-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
