{{/*
Two ExternalSecrets writing into the SAME target Secret (creationPolicy:
Merge), so the Deployment only needs one envFrom, not one per source.
host/port/dbname are passed in as literal (non-secret) Helm values rather
than assumed from the managed secret's own JSON shape - more explicit,
and doesn't depend on exactly which fields AWS happens to populate.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-db-credentials
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Owner
    template:
      # .username/.password go through ESO's urlquery (Sprig's
      # url.QueryEscape) before landing in the URL's userinfo section -
      # RDS's managed master password is Secrets-Manager-generated and
      # can contain any character outside its default excludes (/, @,
      # ", \ - not [, ]), so an unescaped password breaks URL parsing
      # the moment it contains one. Hit live: a generated password
      # containing `[` produced `net/url: invalid userinfo`, crashing
      # the app on every startup attempt (gorm never got a valid *DB).
      data:
        DATABASE_URL: "postgres://{{`{{ .username | urlquery }}`}}:{{`{{ .password | urlquery }}`}}@{{ .Values.aws.rdsEndpoint }}/{{ .Values.aws.rdsDatabaseName }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.aws.rdsSecretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aws.rdsSecretArn }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-app-secrets
spec:
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: backend-secrets
    creationPolicy: Merge
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.aws.ssmJwtSecretPath }}
