name: Terraform

# Plan runs automatically on every PR that touches terraform/ - fast,
# ungated feedback, so it deliberately does NOT reference a GitHub
# Environment (environment-gated jobs pause for that environment's
# required reviewers, which is right for apply but wrong for "just show
# me the diff"). Apply is always a deliberate, manual workflow_dispatch,
# and DOES use the target environment - that's the actual approval gate
# for prod (see terraform/live/main.tf's env_config.prod.github_environment).

on:
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply (dev/staging/prod)"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.13.3"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        workspace: [dev, staging, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/live
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('TERRAFORM_CI_ROLE_ARN_{0}', matrix.workspace)] }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ..

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: select workspace
        run: terraform workspace select ${{ matrix.workspace }} || terraform workspace new ${{ matrix.workspace }}

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
        shell: bash

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('terraform/live/plan_output.txt', 'utf8');
            const output = raw.length > 60000 ? raw.slice(-60000) : raw;
            const marker = `<!-- terraform-plan-${{ matrix.workspace }} -->`;
            const body = `${marker}\n### Terraform Plan — ${{ matrix.workspace }}\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail the job if plan itself failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/live
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: select workspace
        run: terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
